<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Приглашение на ужин ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main class="card">

        <!-- Первый экран -->
        <section class="start-screen" id="startScreen">

            <div class="small-text">
                Для тебя есть кое-что особенное...
            </div>

            <div class="envelope" id="envelope">

                <div class="envelope-back"></div>

                <div class="letter">
                    <div class="letter-content">
                        <span>❤️</span>
                        <p>Приглашение</p>
                    </div>
                </div>

                <div class="envelope-front"></div>

                <div class="envelope-flap"></div>

            </div>

            <button class="open-button" id="openButton">
                Открыть приглашение
            </button>

        </section>


        <!-- Само приглашение -->
        <section class="invitation" id="invitation">

            <div class="decoration decoration-one">✦</div>
            <div class="decoration decoration-two">✧</div>
            <div class="decoration decoration-three">♡</div>

            <div class="invitation-content">

                <div class="top-heart">
                    ♥
                </div>

                <p class="hello">
                    4 u
                </p>

                <h1>
                    Приглашаю<br>
                    тебя на ужин
                </h1>

                <div class="line"></div>

                <p class="main-text">
                    
                </p>


                <div class="details">

                    <div class="detail">
                        <div class="detail-icon">♡</div>

                        <div>
                            <span>Когда</span>
                            <strong>13 сентября</strong>
                        </div>
                    </div>


                    <div class="detail">
                        <div class="detail-icon">☾</div>

                        <div>
                            <span>Во сколько</span>
                            <strong>Вечерком</strong>
                        </div>
                    </div>


                    <div class="detail">
                        <div class="detail-icon">⌖</div>

                        <div>
                            <span>Где</span>
                            <strong>Ленинградская, 3🥰</strong>
                        </div>
                    </div>

                </div>


                <div class="message">

                    <div class="quote">
                        «Даже если нет настроения, я постараюсь его найти»<br>
                    </div>

                </div>


                <button class="answer-button" id="answerButton">
                    Я приду ❤️
                </button>

                <div class="answer" id="answer">
                     🥰
                </div>

                <div class="bottom">
                    Жду тебя
                </div>

            </div>

        </section>

    </main>

    <div class="hearts" id="hearts"></div>

    <script src="script.js"></script>

</body>
</html>
